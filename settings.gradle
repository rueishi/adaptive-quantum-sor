/*
 * Phase 8 multi-project settings for Adaptive Quantum SOR.
 *
 * P8-02 keeps existing Java packages unchanged but gives Gradle the module
 * topology that later cards will fill in. The dependency graph is intentionally
 * broad now so empty modules can build independently while implementation moves
 * into them card by card.
 */
pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        mavenCentral()
    }
}

rootProject.name = 'adaptive-quantum-sor'

include 'sor-api'
include 'sor-core'
include 'sor-codec'
include 'sor-transport-aeron'
include 'sor-transport-http-control'
include 'sor-optimizers-native'
include 'sor-observability'
include 'sor-testkit'
include 'sor-test-server'
include 'sor-client-java'
