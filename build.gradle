/*
 * Root build conventions for the Phase 8 Adaptive Quantum SOR multi-project
 * layout.
 *
 * The framework is split into explicit API, core, simulator, transport,
 * adapter, observability, native-optimizer, server, and client modules. Shared
 * Java/JUnit/JDK 25 conventions live here; module-specific dependencies,
 * application startup, native wiring, and benchmarks stay in each subproject.
 */
import groovy.json.JsonSlurper

plugins {
    id 'base'
    id 'com.google.cloud.tools.jib' version '3.4.4' apply false
}

allprojects {
    group = 'com.nitroj.sor'
    version = '0.8.0-SNAPSHOT'
}

subprojects {
    apply plugin: 'java-library'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        workingDir rootProject.projectDir
        jvmArgs '-XX:+UseZGC',
                '-XX:+AlwaysPreTouch',
                '-Xms2g',
                '-Xmx2g'
    }

    dependencies {
        testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
}

tasks.register('jmhRegressionCheck') {
    description = 'Fails when the JMH result JSON regresses more than 10% from the Phase 8 baseline.'
    group = 'verification'

    def baselineFile = providers.gradleProperty('jmhBaselineFile')
            .map { file(it) }
            .orElse(layout.projectDirectory.file('docs/testing/PHASE_8_JMH_BASELINE.md'))
    def resultFile = providers.gradleProperty('jmhResultFile')
            .map { file(it) }
            .orElse(layout.projectDirectory.file('sor-core/build/reports/jmh/results.json'))

    inputs.file(baselineFile)

    doLast {
        File baseline = baselineFile.get().asFile
        File results = resultFile.get().asFile
        if (!baseline.isFile()) {
            throw new GradleException("JMH baseline file not found: ${baseline}")
        }
        if (!results.isFile()) {
            logger.lifecycle("No JMH result file found at ${results}; skipping regression comparison for this check run.")
            return
        }

        Map<String, BigDecimal> baselineNanos = [:]
        baseline.eachLine { line ->
            def matcher = line =~ /^\|\s*([^|]+?)\s*\|\s*([0-9]+(?:\.[0-9]+)?)\s*\|\s*$/
            if (matcher.matches()) {
                baselineNanos[matcher.group(1).trim()] = new BigDecimal(matcher.group(2))
            }
        }
        if (baselineNanos.isEmpty()) {
            throw new GradleException("No benchmark baseline rows found in ${baseline}")
        }

        def parsed = new JsonSlurper().parse(results)
        parsed.each { entry ->
            String benchmarkName = entry.benchmark as String
            BigDecimal baselineScore = baselineNanos[benchmarkName]
            if (baselineScore == null) {
                return
            }
            BigDecimal currentScore = new BigDecimal(entry.primaryMetric.score.toString())
            BigDecimal allowed = baselineScore.multiply(new BigDecimal('1.10'))
            if (currentScore > allowed) {
                throw new GradleException("JMH regression for ${benchmarkName}: current ${currentScore} ns/op exceeds allowed ${allowed} ns/op from baseline ${baselineScore} ns/op")
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('jmhRegressionCheck')
    dependsOn subprojects.collect { it.tasks.named('check') }
}
