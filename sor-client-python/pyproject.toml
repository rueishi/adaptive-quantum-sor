[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-quantum-sor-client"
version = "1.0.0"
description = "Typed Python SDK for the Adaptive Quantum SOR HTTP control plane"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Nitroj Engineering", email = "engineering@nitroj.com" }]
dependencies = [
  "requests>=2.31",
  "httpx>=0.27"
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "mypy>=1.8",
  "build>=1.2",
  "twine>=5"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["adaptive_quantum_sor_client*"]

[tool.setuptools.package-data]
adaptive_quantum_sor_client = ["py.typed", "*.pyi"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["adaptive_quantum_sor_client"]
